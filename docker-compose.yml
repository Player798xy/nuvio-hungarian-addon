version: '3.8'

services:
  nuvio-hungarian-addon:
    build: .
    image: nuvio-hungarian-addon:latest
    container_name: nuvio-hungarian-addon
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
